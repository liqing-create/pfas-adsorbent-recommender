performance:
  - id: "1"
    requested_Performance_id: "PFBA|GAC-1|NA"
    source_text: |
      Table S8. Adsorption isotherms parameters for the adsorption of PFASs on ACs (pH = 7, PFAS initial concentration = 100 ng L-1).
      | Compounds   | Type of AC   | Langmuir model   | Langmuir model   | Langmuir model   | Freundlich model   | Freundlich model   | Freundlich model   |
      |-------------|--------------|------------------|------------------|------------------|--------------------|--------------------|--------------------|
      | Compounds   | Type of AC   | Q (μg mg /C0 1)  |  k L (10 3 Lmg -1 ) | R2            |   n - 1             | KF (/C2 10 - 3 (  /u1D707 g/mg) (  /u1D707 g/L) -n)  | R2  |
      | PFBA        | GAC-1        | 51.8             | 193.0            | 0.98             | 0.89               | 3              | 0.99               |
      | PFBA        | PAC-1        | 48.5             | 17.2             | 0.98             | 0.91               | 10               | 0.99               |
    expected_record: |
      Performance_id: PFBA|GAC-1|NA
      PFAS_name: PFBA
      Adsorbent_name: GAC-1
      Specific_Condition: NA
      Generic_Condition: pH_7; PFBA_100_ng/L
      Parametric_impact: Adsorbent_type
      Freundlich_equation_form: 1/n
      Freundlich_KF_value: 0.003
      Freundlich_KF_unit: (μg/mg)/(μg/L)^n
      Freundlich_n_or_1/n_verbatim: 1/n_0.89
      Freundlich_R2: 0.99
      Langmuir_Qm_value: 51.8
      Langmuir_Qm_unit: μg/mg
      Langmuir_KL_value: 193000
      Langmuir_KL_unit: L/mg
      Langmuir_R2: 0.98
    notes: |
      Only fields with extractable values are included. Fields without (e.g., removal rate, Kd, etc) are ignored entirely.      
      Units for Qm, KL and KF are explicitly provided provided, they are recorded after normalization (e.g., unicode fixes (/u1D707 → μ); fractional over exponent; collapse spacing).
      Freundlich_KF_value and Langmuir_KL_value: The table header specifies that KF and KL are scaled by 10⁻³ and 10³, respectively. Therefore, the raw entries must be adjusted before recording: 3 × 10⁻³ = 0.003 and 193.0 × 10³ = 193000.
      Freundlich_n_or_1/n_verbatim: trailing “–1” as a negative exponent, so n -1 is n^-1, convert to fration 1/n. 1/n_0.89 → Freundlich_equation_form = 1/n, while Freundlich_KF_unit: (μg/mg)/(μg/L)^n → Freundlich_equation_form = n, Freundlich_n_or_1/n_verbatim > Freundlich_KF_unit, 1/n was adopted.
      Generic_condition: pH and PFAS initial concentration are identical to all records.
      Parametric_impact: Marked Adsorbent_type because the table explicitly compares different adsorbents (GAC-1 vs PAC-1) for the same PFAS under the same conditions. 


  - id: "2"
    requested_Performance_id: "PFOA|HFAC (425-850 um)|calcium_0.1_mM&&sodium chloride_5.8_mM"
    source_text: |
      Table S9.  Performance metrics for PFOA with different salt solutions on HFAC (425-850 um).
      | Ca 2 + (mM)  | NaCl (mM) | log KD    | Qe    |R (mg adsobed / mg in solution) |
      |--------------|-----------|---------|-------|-------|
      | 0            | 0         | 1.1± 0.2   | 4.2 ± 0.2 |576.5   | 
      | 0            | 1         | 0.8± 0.4   | 3.1± 0.4 | 414.7   |  
      | 0.1          | 5,8       | 0.5± 0.3   | 2.7± 0.1 |327.6   | 
    expected_record: |
      Performance_id: PFOA|HFAC (425-850 um)|calcium_0.1_mM&&sodium chloride_5.8_mM
      PFAS_name: PFOA
      Adsorbent_name: HFAC (425-850 um)
      Specific_Condition: calcium_0.1_mM&&sodium chloride_5.8_mM
      Generic_Condition: NA
      Parametric_impact: inorganic_matter
      Kd_value: 3.16
       Qe_value: 2.7
    notes: |
      Generic_Condition: NA is a valid extractable value for Generic_Condition, indicating no universally applicable conditions exists in the current excerpt.
      Parametric_impact: The effects of inorganic matter is examined, based on the entire table rather than solely the specified Performance_id.
      Kd_value: logKd is provided, ignore SD, convert to linear form (10^0.5=3.16).  
       Qe_value: Qe is provided directly, so ignore SD and record the equilibrium value. 
       No units are reported for Kd and Qe, do not hallucinate the unit, omit Qe_unit and Kd_unit fields. 
      R (mg adsorbed/mg in solution) is not a removal rate, as its values are not within the 0–1 range; it is also not Qe, which represents the equilibrium amount adsorbed on the solid phase; nor is it Kd, since the units do not match those of Kd. Therefore, it cannot be mapped to any requested field and was omitted entirely. 

  - id: "3"
    requested_Performance_id: "PFOA|HFAC (425-850 um)|calcium_0.1_mM&&sodium chloride_5.8_mM"
    source_text: |
      Table 2. S. Pseudo second-order parameters of the adsorption of PFOS from Leuna groundwater.
      | ACF adsorbent   | Adsorbate   |   qecal ( μg m /C0 2 )  |    k2 (m 2 μg /C0 1 min /C0 1 ) |    R2 |
      |-----------------|-------------|-----------|------|-------|
      | FC15            | PFOS        |       1.545 | 4.846 | 0.991 |
    expected_record: |
      Performance_id: PFOS|FC15|NA
      PFAS_name: PFOS
      Adsorbent_name: FC15
      Specific_Condition: NA
      Generic_Condition: Leuna groundwater
      Parametric_impact: NA
      PSO_Qe_value: 1.545
      PFO_Qe_unit: μg/m2
      PSO_k2_value: 4.846
      PSO_k2_unit: m2/μg/min
    notes: |
      The excerpt contains a single Performance record, Specific_Condition = NA as no condition is needed to distinguish it from others. Generic_Condition captures the reported experimental conditions (in this case, the table provides Water_matrix information, which should be recorded verbatim).
      Kinetic parameters are normalized to specific spefic surface area (m2) here, record as provided.
      Parametric_impact: NA is recorded (rather than omitted) because it is explicitly prescribed to indicate that no adsorption performance is tied to a parameter sweep. This typically applies to tables with only a single performance record, where no parameter variation is involved. 

  - id: "4"
    requested_Performance_id: "unit"
    source_text: |
      Langmuir (Cs = Qm · KL · Ce / (1 + KL · Ce)), Freundlich, and Temkin models were used for adsorption mechanism analysis[28]. Cs is the adsorbed level (mg/g) and Ce is the concentration (mg / l) adsorbed at equilibrium. KL and kf are Langmuir and Freundlich constants, respectively, 1/n is an empirical constant that specifies the adsorption intensity of the system, and q is the maximum adsorption capacity of the adsorbent. B and KT in the Temkin equation represent constant related to the heat of sorption (J/mol) Temkin isotherm equilibrium binding constant (L/g)
    expected_record: |
      Performance_id: unit 
      Langmuir_Qm_unit: mg/g 
      Langmuir_KL_unit: L/mg 
      Qe_unit: mg/g
    notes: |
      The unit for Qe was explicitly reported. In this case, Cs was used instead of Qe, but since it represents the equilibrium adsorbed level, it is equivalent to Qe.
      No information (Freundlich_n_or_1/n_verbatim, explicit equation text, Freundlich_KF_unit) is present to determine of Freundlich_equation_form, so the field is omitted. 
      Langmuir_Qm_unit and Langmuir_KL_unit were not provided explictly but can be derived from the governing equations together with the reported units of Ce and Qe. From the linear form of Langmuir isotherm, 1/Qe = 1/(Qm.KL.Ce)+1/Qm, each term must share the same unit as 1/Qe. Since Qe and Qm are both given in mg/g, the product Qm.KL.Ce must also yield mg/g. threfore, KL.Ce is dimensionless. with Ce in mg/L, so Langmuir_KL_unit: L/mg.
      The unit for Freundlich_KF_unit is not explictly provided and no governing equation is provided in the excerpt, so the field is omitted.  

adsorbent:
  - id: "1"
    requested_Adsorbent_id: "1230C, StyDex D2"
    source_text: |
      We selected two StyDex polymers each crosslinked with two molar equivalents of styrene derivatives bearing either quaternary ammonium (StyDex D2) or quaternary phosphonium (StyDex E2) ions per mole of StyDex monomer. We also obtained commercially available CCAC AquaCarb ® (1230C, Westates Carbon, Siemens, Roseville, MN), AWAC Filtrasorb ® (400M, Calgon Carbon Co., Pittsburgh, PA), and HFAC (granular activated carbon used at a local drinking water treatment facility to process PFAS-contaminated groundwater). Each AC was pulverized with a mortar and pestle and sieved into different particle size bins (10 e 75, 125 e 212, 425 e 850, and 1000 e 1700 m m); the two smaller size bins are representative of PAC and the two larger size bins are representative of GAC. Specific surface areas and porosity are measured and shown in Table S1. 
    expected_record: |
      Adsorbent_id: 1230C
      Name_Commercial: CCAC AquaCarb ®
      Name_Full: NA
      Name_Abbreviation: 1230C
      Adsorbent_category: Activated carbon
      Adsorbent_subcategory: powdered activated carbon (PAC); granular activated carbon (GAC)
      Vendor: Westates Carbon, Siemens (Roseville, MN)
      Particle_size: 10-75_µm; 125-212_µm; 425-850_µm; 1000-1700_µm

      Adsorbent_id: StyDex D2
      Name_Commercial: NA
      Name_Full: NA
      Name_Abbreviation: StyDex D2
      Adsorbent_category: Cyclodextrin polymers
      Raw_Material: StyDex monomer
      Functional_group: quaternary ammonium
    notes: |
      Only fields with extractable values are included. Fields without extractable values (e.g., surface area and porosity) are ignored entirely.


  - id: "2"
    requested_Adsorbent_id: "PAC"
    source_text: |
      The coal-based activated carbons were first rinsed with deionized water for several times and then washed in 80 /C14 Cdeionized water for 2 h to remove the impurities. After being dried in an oven at 105 /C14 C for 48 h, they were crushed by a mortar and screened. The activated carbons in the size range of 0.9-1.0 mm were used as the granular activated carbon (GAC), while the powder activated carbon (PAC) in this paper represented the particles below 0.1 mm. 
    expected_record: |
      Adsorbent_id: coal-based activated carbons
      Name_Commercial: NA
      Name_Full: coal-based activated carbons
      Name_Abbreviation: NA
      Adsorbent_category: Activated carbon
      Raw_Material: coal

      Adsorbent_id: PAC
      Name_Commercial: NA
      Name_Full: powdered activated carbon
      Name_Abbreviation: PAC
      Adsorbent_category: Activated carbon
      Adsorbent_subcategory: powdered activated carbon (PAC)
      Particle_size: <0.1_mm
      Raw_Material: coal-based activated carbons
      Vendor: lab-made
    notes: |
      "Coal-based activated carbons" were processed to produce named adsorbents (PAC and GAC). Both the original adsorbent (coal-based activated carbons) and the derived adsorbents (PAC, GAC) should be recorded as separate adsorbent entries.  
      "Coal-based activated carbons" describes the activated carbon’s precursor material within its name, this information is parsed out and entered in the Raw_Material field. For the derived adsorbents, the original coal-based activated carbon is listed under Raw_Material.  
      Since PAC (and GAC) was prepared in-house from coal-based activated carbons, the Vendor field is recorded as "lab-made". Because no vendor information is explictly provided for the original coal-based activated carbons or the resins, the Vendor field is omitted for those entries. 

  - id: "3"
    requested_Adsorbent_id: "granular activated carbon"
    source_text: |
