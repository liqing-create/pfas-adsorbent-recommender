      Particle_size was recorded as <measurement>_<unit> format.   
      Total_pore_volume_(cm3/g) was recorded as a numeric value in cm3/g without a pore-type prefix.
      Total surface N content is 2.66%, convert percentage to decimal, N%: 0.0266. 
      Vmicro+meso (cm3/g) = 0.512 Vmicro+meso (cm³/g) = 0.512 was not recorded because it represents the combined volume of micropores and mesopores, which is not among the requested fields. Only total, micro, meso, or macro pore volumes should be recorded in the specific split pore-volume fields, so this value was omitted. 
   
experiment:
  - id: "1"
    requested_Experiment_id: "snapshot|organic_matter"
    source_text: |
       Sorption experiments were carried out in the presence of co -contaminants to determine their influence on the sorption of PFAS onto GAC. Co contaminants -included kerosene (Ker; 0.1 mg/L) as a model fuel extinguished by AFFF, trichloroethylene (TCE; 1 mg/L) as a model solvent that can be present at AFFF sites, and ethanol (Et; 1 mg/L) as an AFFF additive. Experiments were carried out in duplicate with a mixture of PFOA and PFOS and two types of GAC, F400 and CBC. Co contaminants were -added, each separately. Sorption of 0.1 mg of each PFOA and PFOS in the mixture, in the presence of co contaminants, different carbon masses (5 to 15 mg) of each of the two carbon types and a zero control were evaluated in 125 ml of DI water in 150 ml polypropylene reactors. The sample pH was controlled at 7.2 using 0.1 M phosphate buffer. Reactors were tumbled at 145 rpm at room temperature and 1 mL of solution were sampled at 7 days (Table 1).
    expected_record: |
      Experiment_id: snapshot|organic_matter
      Test_mode: snapshot
      Parametric_impact: organic_matter
      Adsorbent_dosage: F400_5-15_mg; CBC_5-15_mg
      Water_type: ultrapure water
      pH: 7.2
      PFAS_initial_concentration: PFOA_0.1_mg; PFOS_0.1_mg
      Organic_matter: kerosene (Ker)_0.1_mg/L; trichloroethylene (TCE)_1_mg/L; ethanol (Et)_1_mg/L
      Background_species: phosphate buffer_0.1_M
      Solution_volume_(mL): 125
      Contact_time_(h): 168
      Temperature_(°C): 25
      Mixing_speed_(rpm): 145
    notes: |
      Only fields with extractable values are included. Fields without extractable values are ignored entirely.
      DI water belongs to ultrapure water.
      Room temperature was converted to 25 °C, 7 days was converted to 168 h.
      Test_mode = snapshot because one PFAS initial concentration, one contact time, and adsorbent dosage is a range (assume <5).
      125 mL is the solution volume while 150 mL is the container volume and 1 ml is the sampling volume. 
      Although the original connector for adsorbent dosage is "to", normalize to hyphen because both bounds are intergers.  

  - id: "2"
    requested_Experiment_id: "snapshot|organic_matter"
    source_text: |
       Batch adsorption experiments with PFOA and PFOS were carried out in 25 mL vessels containing 10 mL solution and 2.5 mg ACFs. The pH of the system was then adjusted to the desired value by adding 0.1 M HCl or NaOH solution. In general, the concentration of Na + in all solutions increased due to pH adjustment by (60 ± 30) µM, which is negligible compared to 10 mM Na2SO4 background electrolyte. The vessels were then shaken overnight by the reciprocal shaker at 120 spm  at room temperature (22 /C14 C). The pH of the solutions containing adsorbent was checked and adjusted again to the desired value; certain concentrations of PFOA and PFOS in the solution were then prepared by adding specific volumes of their 200 mg/L aqueous stock solutions. In the case of NOM experiments, 100 mg/L stock solutions of NOM in 10 mM Na2SO4 adjusted to pH 7 were prepared and used.
    expected_record: |
      Experiment_id: snapshot|organic_matter
      Test_mode: snapshot
      Parametric_impact: organic_matter
      Adsorbent_dosage: ACFs_2.5_mg
      PFAS_initial_concentration: PFOA; PFOS
      Organic_matter: NOM
      Background_species: sodium sulfate_10_mM; hydrochloric acid_0.1_M; sodium hydroxide_0.1_M
      Solution_volume_(mL): 10
      Contact_time_(h): 12
      Temperature_(°C): 22
      Mixing_speed_(rpm): 120
    notes: |
      Adsorbent_dosage is provided in mass, record with this unit.
      For PFAS_initial_concentration, and Organic_matter, only the <descriptor> was provided, no <measurement> values (stock concentrations are not working concentrations), NA is not prescribed for the missing <measurement> values here, so the entire _<measurement>_<unit> portion is omitted. 
      Background_species, Na2SO4 is the background electrolytes while NaOH and HCl are pH adjusting agents (The text indicates that pH adjustment was performed for all experiments, not just those with Parametric_impact = pH). The sodium ion increase (~60 µM) is excluded because it is secondary byproduct of pH adjustment.
      /C14 C is the unicode form of °C.  


  - id: "3"
    requested_Experiment_id: "isotherm|matrix_effect_synthetic water, isotherm|matrix_effect_natural waters, kinetic|matrix_effect_synthetic water, kinetic|matrix_effect_natural waters"
    source_text: |
       For isotherm studies, 10 -1000 mg of resins (221 mg dry weight of resin = 1 mL of wet resin) were mixed for 24 h (equilibrium) with 1 L of synthetic water having 0.1 -100 μ g GenX (or PFMOPrA/PFMOBA)/L and 5 mg C/L initial concentration of SRNOM, or natural waters (surface/ wastewaters). The initial inorganic ion concentration for all the synthetic water tests were between 5 -100 mg/L for all the species (sulphate, nitrate, and bicarbonate). After 24 h, the resins were filtered from the treated water using a 0.45 μ mpre-rinsed syringe filters, prior to determining the final DOC and PFASs concentrations. For kinetic studies, 0.45 mL of resin was mixed with 1 L of water in circular beakers agitated with a Phipps & Bird 9900 Jar tester operated at 150 rpm for contact times varying from 2 min up to 24 h. All synthetic water studies were performed at pH 7.0 ± 0.2, while the studies with natural waters was performed at natural pH (see effect of pH in SI). Triplicate experiments were performed for every experimental condition, and a control test involving contaminant solution without resin was included. Each sample was analyzed in triplicate. 
    expected_record: |
      Experiment_id: isotherm|matrix_effect_synthetic water
      Test_mode: isotherm
      Parametric_impact: matrix_effect_synthetic water
      Adsorbent_dosage: resins_10-1000_mg
      Water_type: synthetic water
      Solution_volume_(mL): 1000
      Contact_time_(h): 24
      PFAS_initial_concentration: GenX_0.1-100_µg/L; PFMOPrA_0.1-100_µg/L; PFMOBA_0.1-100_µg/L
      Background_species: sulfate_5-100_mg/L; nitrate_5-100_mg/L; bicarbonate_5-100_mg/L; SRNOM_5_mg C/L       

      Experiment_id: isotherm|matrix_effect_natural waters
      Test_mode: isotherm
      Parametric_impact: matrix_effect_natural waters
      Adsorbent_dosage: resins_10-1000_mg
      Water_type: surface water; wastewater
      Solution_volume_(mL): 1000
      Contact_time_(h): 24

      Experiment_id: kinetic|matrix_effect_synthetic water
      Test_mode: kinetic
      Parametric_impact: matrix_effect_synthetic water
      Adsorbent_dosage: resin_99.45_mg
      Water_type: synthetic water
      pH: 7
      PFAS_initial_concentration: GenX_0.1-100_µg/L; PFMOPrA_0.1-100_µg/L; PFMOBA_0.1-100_µg/L
      Background_species: sulfate_5-100_mg/L; nitrate_5-100_mg/L; bicarbonate_5-100_mg/L; SRNOM_5_mg C/L       
      Solution_volume_(mL): 1000
      Contact_time_(h): 0.033-24
      Mixing_speed_(rpm): 150

      Experiment_id: kinetic|matrix_effect_natural waters
      Test_mode: kinetic
      Parametric_impact: matrix_effect_natural waters
      Adsorbent_dosage: resin_99.45_mg
      Water_type: surface water; wastewater
      Solution_volume_(mL): 1000
      Contact_time_(h): 0.033-24
      Mixing_speed_(rpm): 150
    notes: |
      Isotherm and kinetic experiments were performed in both synthetic water and natural waters, resulting in two records each and 4 records in total.  
      For the synthetic water, PFAS (0.1–100 µg/L), SRNOM (5 mg/L), and inorganic ions (sulfate, nitrate, bicarbonate, each 5–100 mg/L) were explicitly spiked but they aren’t the parameter under study. So they belong under Background_species, not under Added_*.
      The excerpt does not report PFAS concentrations or water composition for the natural waters (surface water, wastewater). Do not infer these values from the synthetic water entries, as no explicit statement links them.
      0.45 mL resin was converted to 99.45 mg using the conversion factor provided in the excerpt (0.45 mL * 221 mg/ml).

  - id: "4"
    requested_Experiment_id: "water_properties_surface water (SW)|NA, water_properties_organic-free water|NA"
    source_text: |
       Organic-free water was prepared from distilled water buffered with a 1 × 10 -3 mol/L sodium bicarbonate solution. The surface water used in all the experiments was collected from the Finger Lake in New York (denoted as SW). It is characterized by an organic content of 5.0 ± 0.1 mg/L DOC, a conductivity of 736 ± 17 μ S/ cm, a pH of 7.5 ± 0.2, a specific UV absorbance at 254 nm (SUVA254) value of 2.1 ± 0.2 L/(mg·m). For both batch isotherms and RSSCTs tests, these water samples were spiked with a PFAS stock solution containing 10 mg/L each of the eight PFAS to adjust their concentrations at 1 μ g/L each in the test solutions.
    expected_record: |
      Experiment_id: water_properties_surface water (SW)|NA
      Test_mode: water_properties_surface water (SW)
      Parametric_impact: NA
      Water_sample_source: Finger Lake
      Water_sample_location: New York
      Water_type: surface water
      pH: 7.5
      DOC_(mg/L): 5
      Conductivity_(µS/cm): 736
      PFAS_initial_concentration: general_1_μg/L

      Experiment_id: water_properties_organic-free water|NA
      Test_mode: water_properties_organic-free water
      Parametric_impact: NA
      Water_type: ultrapure water
      PFAS_initial_concentration: general_1_μg/L
      Background_species: sodium bicarbonate_1e-3_mol/L

    notes: |
      Water_type is chosen from the predefined shortlist. Water_type for organic-free water is ultrapure water because it derives from distilled water before adding buffer agent.  
      surface water (SW) is used as the <WaterLabel> in water_properties_<WaterLabel> because both “surface water” and “SW” refer to the same water sample, <WaterLabel> is constructed as Long name (Short name).
      The 1 µg/L value is recorded under PFAS_initial_concentration because it represents the working concentration in the test solutions. Note the stock solution concentration (10 mg/L) is still excluded. Since the excerpt does not name the individual PFAS species, the concentration is captured as general_1_µg/L. 
      NaHCO3 was added to the organic-free water as a buffer agent, so it is recorded under Background_species for the organic-free water entry. For the surface water, no background species, pH adjustment agents, or buffers were explicitly reported, so the Background_species field is omitted. Do not infer that NaHCO₃ was added to surface water simply because it was present in the organic-free water; no such statement is provided.  
