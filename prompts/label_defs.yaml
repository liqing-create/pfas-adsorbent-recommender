  - id: "Example 16"
    source_text: >
      Table S9-1. PFOA removal data of GAC under different pH.
      |              | 0.5h         | 0.5h     | 4h       | 4h     |
      |--------------|--------------|----------|----------|--------|
      | compound     | avg rmvl     | stdev    | avg rmvl | stdev  |
      | pH = 5       | 43.7%        | 0.1%     | 32.9%    | 2.7%   |
