      | Kinetics   | PFA400 PFA444 Dow Marathon A IRA400 GAC | 0.50                             | 100                | 120 rpm, 25 C /C14 at 1, 3, 6, 12, 24, 48, and 72 h |                                                                                                                         
    expected_label: "experiment"
