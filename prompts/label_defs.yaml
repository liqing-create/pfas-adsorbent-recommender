    comments: "performance label: table body lists absolute values of performance metrics (Qm, KL, KF, n) (performance criteria 1); no experiment label: experimental parameters (PFOA initial concentration, pH) appear in the table that presents performance metric data does not trigger experiment label; adsorbent label: the footnote explicitly provides abbreviation–full/commercial name pairs (e.g., “F300: Filtrasorb F300,” “CDP: cyclodextrin polymer”), satisfying adsorbent criteria 1. Note: if the footnote were absent and only abbreviations appeared without the corresponding full/commercial names, criteria 1 would no longer be met."

